<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to Tengine!</title>
    <style>
        :root {
            --color-text: #333333;
            --color-link: #0066cc;
            --color-bg: #f9f9f9;
        }

        body {
            max-width: 40rem;
            margin: 4rem auto;
            padding: 0 1.5rem;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            color: var(--color-text);
            background-color: var(--color-bg);
            line-height: 1.6;
        }

        h1 {
            font-size: 2.25rem;
            font-weight: 700;
            margin-bottom: 1.5rem;
        }

        p {
            margin-bottom: 1.25rem;
        }

        a {
            color: var(--color-link);
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        em {
            font-style: italic;
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <h1>Welcome to Tengine!</h1>
    
    <p>If you see this page, the Tengine web server is successfully installed and working. Further configuration is required.</p>

    <p>For online documentation and support, please refer to 
        <a href="https://tengine.taobao.org/" target="_blank" rel="noopener noreferrer">tengine.taobao.org</a>.
    </p>

    <p><em>Thank you for using Tengine.</em></p>
</body>
</html>
